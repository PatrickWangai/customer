services:
  - type: web
    name: masterways-customer
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      # Shares the CRM's existing Postgres instance (Render's free tier only
      # allows one active free database per account) — paste the CRM
      # database's Internal Database URL here when applying this blueprint.
      # Prisma creates its own `support_requests` table alongside the CRM's
      # tables; no naming collision, no shared code or auth.
      - key: DATABASE_URL
        sync: false
      - key: SUPPORT_EMAIL
        value: support@masterways.co.ke
      - key: NODE_ENV
        value: production
      # Server-to-server bridge into the main CRM (separate repo/deployment)
      # so a submission here also creates a real Ticket there. Set
      # CRM_API_URL to the CRM's live URL (e.g.
      # https://masterways-crm.onrender.com — no trailing slash needed).
      # PUBLIC_API_KEY must match the CRM's own PUBLIC_API_KEY exactly, or
      # the bridge call is rejected with 401 and the request stays
      # capture-only (still succeeds locally, just doesn't forward).
      - key: CRM_API_URL
        value: https://masterways-crm.onrender.com
      - key: PUBLIC_API_KEY
        value: 7ff32f1144d2c129a717f4c33919b46dded463dd5a4e17ed12bc8402683f80f9
