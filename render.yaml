services:
  - type: web
    name: masterways-customer
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      # Shares the CRM's existing Postgres instance (Render's free tier only
      # allows one active free database per account) — paste the CRM
      # database's Internal Database URL here when applying this blueprint.
      # Prisma creates its own `support_requests` table alongside the CRM's
      # tables; no naming collision, no shared code or auth.
      - key: DATABASE_URL
        sync: false
      - key: SUPPORT_EMAIL
        value: support@masterways.co.ke
      # Both optional — the "Call us" / "WhatsApp" header links only render
      # when set. Phone numbers in international format (e.g. 2547XXXXXXXX),
      # no "+" needed for SUPPORT_WHATSAPP (passed straight into a wa.me
      # link). Leave unset via the dashboard to hide either link.
      - key: SUPPORT_PHONE
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false
      - key: NODE_ENV
        value: production
      # Server-to-server bridge into the main CRM (separate repo/deployment)
      # so a submission here also creates a real Ticket there. Set
      # CRM_API_URL to the CRM's live URL (e.g.
      # https://masterways-crm.onrender.com — no trailing slash needed).
      # PUBLIC_API_KEY must match the CRM's own PUBLIC_API_KEY exactly, or
      # the bridge call is rejected with 401 and the request stays
      # capture-only (still succeeds locally, just doesn't forward).
      - key: CRM_API_URL
        value: https://masterways-crm.onrender.com
      - key: PUBLIC_API_KEY
        value: 7ff32f1144d2c129a717f4c33919b46dded463dd5a4e17ed12bc8402683f80f9
      # Same URL as CRM_API_URL above, but NEXT_PUBLIC_-prefixed so the
      # browser (not just this server) can reach it directly — needed for
      # the live-visitor presence beacon (presence-tracker.tsx), which fires
      # straight from the visitor's browser, not through this app's server.
      - key: NEXT_PUBLIC_CRM_URL
        value: https://masterways-crm.onrender.com
      # Google Gemini free tier — powers the "Ask a question" path in the
      # public chatbot. Without it, that button still shows but falls back
      # to "I'm not able to answer that right now". Same key as the CRM's
      # own GEMINI_API_KEY (one Google account, reused). Get one (no card
      # required) at aistudio.google.com/apikey.
      - key: GEMINI_API_KEY
        sync: false
