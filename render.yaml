databases:
  - name: customer-support-db
    plan: free
    databaseName: customer_support
    user: customer_support

services:
  - type: web
    name: masterways-customer
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: customer-support-db
          property: connectionString
      - key: SUPPORT_EMAIL
        value: support@masterways.co.ke
      - key: NODE_ENV
        value: production
